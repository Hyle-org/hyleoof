[package]
name = "server"
version = { workspace = true }
edition = { workspace = true }
# license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }

[dependencies]
sdk = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-contract-sdk", features = [
  "tracing",
], tag = "v0.13.0-rc.1" }
client-sdk = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-client-sdk", default-features = false, features = [
  "risc0",
  "rest",
], tag = "v0.13.0-rc.1" }
hyllar = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-hyllar", features = [
  "client",
], tag = "v0.13.0-rc.1" }
hydentity = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-hydentity", features = [
  "client",
], tag = "v0.13.0-rc.1" }
amm = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-amm", features = [
  "client",
], tag = "v0.13.0-rc.1" }
hyle_contracts = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-contracts", tag = "v0.13.0-rc.1" }
bonsai_runner = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle-bonsai-runner", features = [
], tag = "v0.13.0-rc.1" }
hyle = { git = "https://github.com/Hyle-org/hyle.git", package = "hyle", features = [
], tag = "v0.13.0-rc.1" }

# hyle_metamask = { path = "/home/bertrand/workspace/metamask-id/metamask-contract/contract", package="contract-identity", features = ["client"] }
hyle_metamask = { git = "https://github.com/Hyle-org/metamask-id.git", package = "contract-identity", features = [
  "client",
] }

risc0-zkvm = { version = "1.2.2", features = ["prove"] }

