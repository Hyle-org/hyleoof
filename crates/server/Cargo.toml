# bonsai_runner = { path = "/home/bertrand/workspace/hyle2/crates/bonsai-runner", package="bonsai-runner", features = [] }
# hyle = { path = "/home/bertrand/workspace/hyle2", package="hyle", features = []  }

axum = "0.8.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tower-http = { version = "0.6.2", features = ["cors"] }
anyhow = "1.0.93"
reqwest = { version = "0.12.9", features = ["json"] }
hex = "0.4.3"

borsh = "1.5.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
clap = "4.5.28"
utoipa-axum = { version = "0.2.0" }
utoipa = "5.3.1"
